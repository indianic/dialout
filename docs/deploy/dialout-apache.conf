# Dialout — Apache directives for the ISPConfig site
#
# Paste into: ISPConfig → Sites → dialout.dev → Options → Apache Directives.
#
# Measured on the server 2026-08-31: Apache listens on 80 and 443 only.
# Nothing is listening on 50002, so there is no separate vhost port to target —
# these directives go on the normal 443 vhost and proxy inward to the two Node
# processes on localhost.
#
# Required modules (all standard, enable with a2enmod as root if missing):
#   proxy  proxy_http  proxy_wstunnel  rewrite  headers
#
# ── Canonical host ─────────────────────────────────────────────────────────
# www.dialout.dev is canonical. The apex already 301s to it, which is the
# behaviour we want — keep it.
#
# The certificate must cover www.dialout.dev, and NEXT_PUBLIC_APP_URL /
# NEXT_PUBLIC_WS_URL in the server .env are set to it exactly (https:// and
# wss:// respectively). They have to match: a redirect between apex and www in
# the middle of a WebSocket upgrade drops the connection, and the browser will
# look like it connected and then gone silent.

ProxyPreserveHost On
ProxyRequests Off

# The /ws prefix is STRIPPED on the way through. The ws-server matches bare
# pathnames — '/multiplex', '/terminal', '/dashboard', '/daemon', '/tunnel/…' —
# so proxying to .../ws/ hands it '/ws/multiplex', which matches nothing.
# Measured on the running server: /multiplex returns 401 (handler reached),
# /ws/multiplex returns 404. Getting this wrong is invisible until someone
# opens a terminal.
#
# The WebSocket upgrade has to be matched BEFORE the generic ProxyPass rules.
# If it is not, /ws/ is proxied as ordinary HTTP: the handshake returns 200
# instead of 101, terminals appear to connect, and then nothing ever arrives.
# That failure mode is the single most common one in this setup.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade   [NC]
RewriteRule ^/?ws/(.*) ws://127.0.0.1:50052/$1 [P,L]

# Ordinary HTTP traffic to the WebSocket server: the tunnel's HTTP passthrough
# and the relay endpoints both arrive here.
ProxyPass        /ws/  http://127.0.0.1:50052/
ProxyPassReverse /ws/  http://127.0.0.1:50052/

# Everything else is the Next.js app.
ProxyPass        /     http://127.0.0.1:50051/
ProxyPassReverse /     http://127.0.0.1:50051/

# The app terminates TLS at Apache, so tell it the original scheme. Without
# this, links built server-side come out as http:// behind an https:// site.
RequestHeader set X-Forwarded-Proto "https"

# Terminals and tunnels hold long-lived connections. The default proxy timeout
# will cut an idle tmux session.
ProxyTimeout 3600
